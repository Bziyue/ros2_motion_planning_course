# Select the entire plant/planner/controller stack here. Restart after edits.
# Physical values are copied by launch to BOTH the plant and planner/controller.
vehicle:
  model: ackermann
  localization: truth
  radius: 0.4
  mass: 1.0
  linear_drag: 0.15
  force_max: 2.0
  wheelbase: 0.3
  steering_max: 0.6
  steering_rate_max: 1.0
/**:
  ros__parameters:
    use_sim_time: true
    x: -8.0
    y: -8.0
    seed: 42
    width: 20.0
    height: 20.0
    circle_count: 8
    polygon_count: 8
    size_min: 0.35
    size_max: 1.2
    polygon_samples: 8
    goal_x: -4.0
    goal_y: -4.0
    margin: 0.05
    require_connected: true
    check_resolution: 0.25
simulator:
  ros__parameters:
    publish_truth_tf: false
    dt: 0.005
    yaw: 0.0
    start_paused: true
    command_timeout: 0.25
    lidar.enabled: true
    lidar.backend: cpu
    lidar.scan_model: snapshot
    lidar.beams: 720
    lidar.angle_min: -3.141592653589793
    lidar.fov: 6.283185307179586
    lidar.rate: 10.0
    lidar.range_min: 0.05
    lidar.range_max: 6.0
    lidar.range_stddev: 0.01
    lidar.noise_seed: 4242
    lidar.visualize_beams: false
    imu.enabled: true
    imu.rate: 200.0
    imu.gravity: 9.81
    imu.gyro_stddev:
    - 0.002
    - 0.003
    - 0.004
    imu.accel_stddev:
    - 0.04
    - 0.05
    - 0.06
    imu.noise_seed: 6060
    imu.visualize: false
slam:
  ros__parameters:
    slam.enable_loops: true
    slam.keyframe_distance: 0.3
    slam.keyframe_angle: 0.25
    slam.keyframe_seconds: 2.0
    slam.min_separation: 20
    slam.candidate_distance: 0.8
    slam.max_frames: 200
    mapping.resolution: 0.1
    mapping.width_cells: 220
    mapping.height_cells: 220
    mapping.origin_x: -11.0
    mapping.origin_y: -11.0
    mapping.hit_probability: 0.7
    mapping.miss_probability: 0.4
    mapping.logodds_limit: 4.0
lidar_odometry:
  ros__parameters:
    estimation.metric: line
    estimation.voxel_size: 0.06
    estimation.normal_radius: 0.4
    estimation.association_distance: 0.5
    estimation.max_rmse: 0.15
    estimation.max_keyframes: 5
    estimation.keyframe_distance: 0.2
    estimation.keyframe_angle: 0.15
    estimation.max_gap: 1.0
fusion:
  ros__parameters:
    fusion.estimate_bias: true
    fusion.innovation_gate: 16.3
    fusion.history_seconds: 2.0
    fusion.stale_seconds: 0.5
mapping:
  ros__parameters:
    mapping.resolution: 0.1
    mapping.width_cells: 220
    mapping.height_cells: 220
    mapping.origin_x: -11.0
    mapping.origin_y: -11.0
    mapping.hit_probability: 0.7
    mapping.miss_probability: 0.4
    mapping.logodds_limit: 4.0
flat_vehicle:
  ros__parameters:
    tracking_margin: 0.15
    goal_tolerance: 0.08
    control.rate_hz: 50.0
    planning.backend: spline
    planning.solve_budget: 1.0
    planning.speed_max: 0.7
    planning.force_max: 1.0
    planning.force_rate_max: 2.0
    planning.steering_max: 0.5
    planning.steering_rate_max: 0.7
    planning.lateral_acceleration_max: 0.8
